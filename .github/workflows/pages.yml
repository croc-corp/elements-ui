name: Registry on GitHub Pages

# Builds the shadcn registry with item URLs under the GitHub Pages site of this repository and publishes it, so
# components install from https://<owner>.github.io/<repository>/r/{name}.json. The registry is static JSON: the
# site itself is not deployed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push waits instead of cancelling a deployment that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # the item URLs and every registryDependencies URL point at the Pages site
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      # actions are pinned to commits; Dependabot keeps them current
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the registry
        run: |
          pnpm catalog
          pnpm registry:build

      # only the registry items: .registry/r becomes /r on the site
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R .registry/r _site/r
          touch _site/.nojekyll
          count="$(find _site/r -name '*.json' | wc -l)"
          echo "### Registry: $count items at $NEXT_PUBLIC_SITE_URL/r/{name}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only this job can write to Pages, with a short-lived OIDC token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}r/lumesec-theme.json
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
